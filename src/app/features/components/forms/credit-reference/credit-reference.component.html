<form [formGroup]="form">
  <div class="mb-3">
    <div class="d-flex justify-content-between">
      <div class="d-flex align-items-center gap-2">
        <label class="form-label">Current</label>
        <label class="form-label fw-bold">{{selectedUser?.creditReference || 0}}</label>
      </div>
      <button class="btn btn-sm btn-info">Logs</button>
    </div>
  </div>
  <div class="mb-3">
    <label class="form-label">New</label>
    <input type="text" class="form-control" formControlName="creditReference" />
  </div>
  <div class="mb-3">
    <label class="form-label">Google Authenticator OTP</label>
    <div class="input-group input-group-flat pass-group">
      <input type="number" class="pass-input form-control" formControlName="googleOtp">
    </div>
  </div>
</form>
