<div class="container-fluid">

  <div class="sub-tabs mb-4">

    <button class="tab-btn" [class.active]="activeTab === 'addImages'" (click)="activeTab = 'addImages'">

      Add Images

    </button>

    <button class="tab-btn" [class.active]="activeTab === 'imagesList'"
      (click)="activeTab = 'imagesList'; getImagesList()">

      Images List

    </button>

  </div>

  <div class="card main-card" *ngIf="activeTab === 'addImages'">

    <div class="card-body">

      <h3 class="page-title">Casino Images</h3>

      <form [formGroup]="imageForm">

        <!-- PROVIDER + CATEGORY -->

        <div class="row">

          <div class="col-md-6 mb-3">

            <label class="form-label">
              Select Provider
            </label>

            <select class="form-select" formControlName="provider" (change)="onProviderChange($event)">

              <option value="">
                Select Provider
              </option>

              <option *ngFor="let item of providers" [value]="item._id">

                {{ item.provider_name }}

              </option>

            </select>

          </div>

          <div class="col-md-6 mb-3">

            <label class="form-label">
              Select Category
            </label>

            <select class="form-select" formControlName="category">

              <option value="">
                Select Category
              </option>

              <option *ngFor="let item of categories" [value]="item._id">

                {{ item.name }}

              </option>

            </select>

          </div>

        </div>

        <!-- DYNAMIC ROWS -->

        <div formArrayName="images">

          <div class="row align-items-end image-row" *ngFor="let item of imagesArray.controls; let i = index"
            [formGroupName]="i">

            <!-- IMAGE NAME -->

            <div class="col-md-3 mb-3">

              <label class="form-label">
                Image Name
              </label>

              <input type="text" class="form-control" placeholder="Enter Image Name" formControlName="image_name">

            </div>

            <!-- GAME CODE -->

            <div class="col-md-2 mb-3">

              <label class="form-label">
                Game Code
              </label>

              <input type="text" class="form-control" placeholder="Enter Game Code" formControlName="game_code">

            </div>

            <!-- IMAGE -->

            <div class="col-md-3 mb-3">

              <label class="form-label">
                Image
              </label>

              <input type="file" class="form-control" (change)="onFileSelect($event, i)">

            </div>

            <!-- IMAGE URL -->

            <div class="col-md-3 mb-3">

              <label class="form-label">
                Image URL
              </label>

              <input type="text" class="form-control" placeholder="Enter Image Url" formControlName="image_url">

            </div>

            <!-- ACTION BUTTON -->

            <div class="col-md-1 mb-3">
              <!-- FIRST ROW ADD BUTTON -->
              <button *ngIf="i === 0" type="button" class="btn btn-primary w-100" (click)="addRow()">+</button>
              <!-- OTHER ROWS REMOVE BUTTON -->
              <button *ngIf="i !== 0" type="button" class="btn btn-danger w-100" (click)="removeRow(i)">-</button>
            </div>

          </div>

        </div>

        <!-- BUTTONS -->

        <div class="mt-4 d-flex gap-2">

          <button type="button" class="btn btn-success" [disabled]="isLoading" (click)="submitImages()">

            {{ isLoading ? 'Saving...' : 'Save' }}

          </button>

          <button type="reset" class="btn btn-secondary">

            Cancel

          </button>

        </div>

      </form>

    </div>

  </div>

  <div *ngIf="activeTab === 'imagesList'">

    <div class="table-responsive">

      <table class="table custom-table align-middle">

        <thead>

          <tr>

            <th>S.No</th>
            <th>Provider</th>
            <th>Category</th>
            <th>Featured</th>
            <th>Image Name</th>
            <th>Game Code</th>
            <th>Image</th>
            <th>URL</th>
            <th>Action</th>

          </tr>

        </thead>

        <tbody>

          <tr *ngFor="let item of imagesList; let i = index">

            <td>{{ i + 1 }}</td>

            <td>
              {{ item.provider_id?.provider_name }}
            </td>

            <td>
              {{ item.category_id?.name }}
            </td>

            <td>

              <div class="form-check form-switch">

                <input class="form-check-input" type="checkbox" [checked]="item.image_fav_game" (change)="updateFeaturedStatus($event, item)">

              </div>

            </td>

            <td>
              {{ item.name }}
            </td>

            <td>
              {{ item.game_code }}
            </td>

            <td>

              <img [src]="baseUrl+item.image" class="table-image">

            </td>

            <td>

              <a [href]="item.image_url" target="_blank">
                {{ item.image_url }}
              </a>

            </td>

            <td>

              <div class="d-flex gap-2">

                <button class="btn btn-sm btn-primary" (click)="openEditModal(item)">

                  Edit

                </button>

                <button class="btn btn-sm btn-danger" (click)="deleteImage(item)">

                  Delete

                </button>

              </div>

            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </div>
</div>

<div
  class="modal fade"
  id="editImageModal"
  tabindex="-1">

  <div class="modal-dialog modal-lg">

    <div class="modal-content">

      <div class="modal-header">

        <h5 class="modal-title">
          Update Image
        </h5>

        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal">
        </button>

      </div>

      <div class="modal-body">

        <form [formGroup]="editForm">

          <div class="row">

            <!-- PROVIDER -->

            <div class="col-md-6 mb-3">

              <label class="form-label">
                Provider
              </label>

              <select
                class="form-select"
                formControlName="provider"
                (change)="onEditProviderChange($event)">

                <option value="">
                  Select Provider
                </option>

                <option
                  *ngFor="let item of providers"
                  [value]="item._id">

                  {{ item.provider_name }}

                </option>

              </select>

            </div>

            <!-- CATEGORY -->

            <div class="col-md-6 mb-3">

              <label class="form-label">
                Category
              </label>

              <select
                class="form-select"
                formControlName="category">

                <option value="">
                  Select Category
                </option>

                <option
                  *ngFor="let item of editCategories"
                  [value]="item._id">

                  {{ item.name }}

                </option>

              </select>

            </div>

            <!-- IMAGE NAME -->

            <div class="col-md-6 mb-3">

              <label class="form-label">
                Image Name
              </label>

              <input
                type="text"
                class="form-control"
                formControlName="image_name">

            </div>

            <!-- GAME CODE -->

            <div class="col-md-6 mb-3">

              <label class="form-label">
                Game Code
              </label>

              <input
                type="text"
                class="form-control"
                formControlName="game_code">

            </div>

            <!-- IMAGE URL -->

            <div class="col-md-6 mb-3">

              <label class="form-label">
                Image URL
              </label>

              <input
                type="text"
                class="form-control"
                formControlName="image_url">

            </div>

            <!-- IMAGE -->

            <div class="col-md-6 mb-3">

              <label class="form-label">
                Update Image
              </label>

              <input
                type="file"
                class="form-control"
                (change)="onEditFileSelect($event)">

            </div>

          </div>

        </form>

      </div>

      <div class="modal-footer">

        <button
          type="button"
          class="btn btn-secondary"
          data-bs-dismiss="modal">

          Cancel

        </button>

        <button
          type="button"
          class="btn btn-primary"
          (click)="updateImage()">

          Update

        </button>

      </div>

    </div>

  </div>

</div>
