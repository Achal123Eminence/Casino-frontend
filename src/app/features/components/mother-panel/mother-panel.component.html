<!-- ============================= -->
<!-- TOP FILTER + ADD SECTION -->
<!-- ============================= -->

<form [formGroup]="userForm" (ngSubmit)="onSubmit()">
  <div class="row mb-4 align-items-end main-card">

    <!-- Select User -->
    <div class="col-md-4 mb-3">
      <label class="form-label text-light mb-2">Select User</label>

      <select
        class="form-select custom-input"
        formControlName="user_id"
      >
        <option value="">Select User</option>

        <option
          *ngFor="let user of users"
          [value]="user._id"
        >
          {{ user.userName }}
        </option>
      </select>

      <div
        class="text-danger mt-1"
        *ngIf="userForm.get('user_id')?.touched && userForm.get('user_id')?.invalid"
      >
        Please select user
      </div>
    </div>

    <!-- Website Input -->
    <div class="col-md-5 mb-3">
      <label class="form-label text-light mb-2">
        Mother Panel
      </label>

      <input
        type="text"
        class="form-control custom-input"
        placeholder="Enter Mother Panel"
        formControlName="mother_panel"
        (keypress)="blockSpecialChars($event)"
        (paste)="blockPaste($event)"
      />

      <div
        class="text-danger mt-1"
        *ngIf="userForm.get('mother_panel')?.touched && userForm.get('mother_panel')?.errors?.['required']"
      >
        Mother Panel is required
      </div>

      <div
        class="text-danger mt-1"
        *ngIf="userForm.get('mother_panel')?.touched && userForm.get('mother_panel')?.errors?.['pattern']"
      >
        Only letters, numbers, dot(.) and underscore(_) allowed
      </div>
    </div>

    <!-- Add Button -->
    <div class="col-md-3 mb-3">
      <button
        type="submit"
        class="btn add-btn w-100"
      >
        <i class="fa fa-plus me-2"></i>
        Add Mother Panel
      </button>
    </div>

  </div>
</form>



<!-- ============================= -->
<!-- TABLE -->
<!-- ============================= -->

<div class="table-responsive">
  <table class="table custom-table align-middle">

    <thead>
      <tr>
        <th>Sr.No</th>
        <th>User Name</th>
        <th>Mother Panel</th>
        <th>Website</th>
        <th>Action</th>
        <th>Portfolio</th>
      </tr>
    </thead>

    <tbody>

      <tr *ngFor="let item of motherPanelList; let i = index">

        <td>{{ i + 1 }}</td>

        <td>
          {{ item?.user_id?.userName }}
        </td>

        <td>
          {{ item?.mother_panel }}
        </td>

        <td>
          <button
            routerLink="/add-website-b2b"
            class="btn website-btn"
          >
            Add Website
          </button>
        </td>

        <td>

          <button
            class="btn edit-btn me-2"
            (click)="editMotherPanel(item)"
          >
            <i class="fa fa-pencil"></i>
          </button>

          <button
            class="btn delete-btn"
            (click)="deleteMotherPanel(item._id)"
          >
            <i class="fa fa-trash"></i>
          </button>

        </td>

        <td>
          <button
            routerLink="/client-list-b2b"
            class="btn portfolio-btn"
          >
            Make Changes
          </button>
        </td>

      </tr>

      <tr *ngIf="motherPanelList?.length == 0">
        <td colspan="6" class="text-center text-light py-4">
          No Data Found
        </td>
      </tr>

    </tbody>

  </table>
</div>
